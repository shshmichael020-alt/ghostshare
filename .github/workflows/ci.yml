name: GhostShare CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Principle of least privilege: default all permissions to read-only
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run Test Suite
        run: npm test

      - name: Build OpenNext for Cloudflare
        run: npm run cf:build
